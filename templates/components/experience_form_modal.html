<div id="add-experience-modal" popover="manual" class="experience-form-modal">
    <button class="experience-form-modal__backdrop" popovertarget="add-experience-modal" popovertargetaction="hide"></button>
    
    <div class="experience-form-modal__content">
        <button type="button" class="experience-form-modal__close" popovertarget="add-experience-modal" popovertargetaction="hide">
            <span aria-hidden="true">&times;</span>
        </button>
        
        <h2>Tambah Experience Baru</h2>
        
        <form id="experience-form">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <p class="form-error">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}
            <div class="experience-form-modal__actions">
                <button type="button" class="button button-secondary" popovertarget="add-experience-modal" popovertargetaction="hide">Batal</button>
                <button type="submit" class="button">Simpan</button>
            </div>
        </form>
    </div>
</div>
